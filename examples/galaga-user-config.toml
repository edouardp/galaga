# Galaga user configuration example
#
# Copy this file to ~/.config/galaga_python/config.toml for user-wide defaults.
# For project overrides, copy it to .galaga_python.toml in the project root.
# Galaga reads the global file first, then ancestor files down to the current
# working directory. The closest file wins where settings overlap.
#
# To load this example without copying it, call config.load(files=[path])
# from Python. Importing galaga does not read configuration files;
# constructing a new facade Algebra or calling config.load() does.
# For one algebra, Algebra(3, user_config_files=False) skips these files.
#
# Every file needs this schema version. Galaga rejects unknown fields.
version = 1

# Defaults apply automatically to new Algebra(...) values. They affect only
# presentation; an algebra's metric and operations still come from its
# constructor arguments or explicit algebra configuration.
#
# A presentation is sparse: omit any setting you want to inherit. The @ prefix
# selects a named profile in reference fields. Here it selects the notation
# defined later in this file; a literal notation rule would use a TOML table.
[defaults.presentation]
notation = "@textbook"
# Optional: use dimension-independent indexed blade labels in every algebra.
# blades = { preset = "indexed", prefix = "v" }

# This is the default number of decimal places shown for coefficients.
# A presentation chosen explicitly in Python can override it.
[defaults.presentation.display]
coefficient_precision = 4

# Named notations are available through settings.notation("textbook"), where
# settings = config.load(). This one also applies automatically because the
# defaults section refers to it. Notation changes rendering, not the result.
# The reverse operator will display with a dagger instead of a tilde.
[notations.textbook]
reverse = "dagger"

# An operation-level shorthand applies to all three output targets. This
# reproduces the familiar half-commutator layout, using 1/2, ½, or \tfrac{1}{2}
# as appropriate. The comma separates the opening and closing delimiters.
[notations.textbook.rules]
half_commutator = "wrapper:1/2[,]"

# A target-level shorthand changes only LaTeX. The symbol name "star"
# resolves through Galaga's LaTeX-to-Unicode symbol map.
[notations.textbook.rules.right_hodge_dual]
latex = "superscript:star"

# Left and right Hodge duals have separate operation IDs and positions.
# The full rule table remains available for every option. Single-quoted TOML
# strings keep LaTeX backslashes literal. The ordinary dual operation also
# has its own rule, if you wish to change it.
[notations.textbook.rules.left_hodge_dual.latex]
kind = "subscript"
symbol = '\star'

# Named presentations are reusable recipes; they are not applied merely by
# being defined. Use settings.presentation("article") with Algebra's
# presentation= argument or with algebra.with_presentation(...).
# This profile requests LaTeX output and a fuller expression display.
[presentations.article]
notation = "@textbook"
display = { target = "latex", content = "full", coefficient_precision = 6 }

# A named presenter can build on a presentation and specialize one setting.
# Here it displays values rather than the full expression. Use it as
# settings.presenter("article_value")(multivector).
[presenters.article_value]
presentation = "@article"
content = "value"

# Named algebras contain an explicit numeric definition. They do not replace
# the constructor's metric by default. To use this one:
#
#     spacetime = Algebra(config="@spacetime_article")
#
# This name is resolved from the discovered files on each construction. To
# hold a fixed configuration, use a resolved snapshot instead:
#
#     settings = config.load()
#     spacetime = Algebra(config=settings.algebra("spacetime_article"))
#
# Named algebra configurations also receive the file's presentation defaults
# before their own presentation reference is applied.
[algebras.spacetime_article]
preset = "sta"
args = { signature = "mostly-minus", sigmas = true }
presentation = "@article"

[project]
name = "galaga-annotation"
version = "2.0.0a7"
description = "Semantic annotations and KaTeX rendering for galaga calculations"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Edouard Poor" }]
keywords = ["geometric-algebra", "annotation", "katex", "teaching", "galaga"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "galaga>=2.0.0a7",
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/edouardp/galaga"
Repository = "https://github.com/edouardp/galaga"
Issues = "https://github.com/edouardp/galaga/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["galaga_annotation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
